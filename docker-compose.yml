services:
  api:
    image: rook-backend:local
    build:
      context: ./apps/api
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ROOK_DB_HOST: postgres
      ROOK_DB_PORT: "5432"
      ROOK_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ROOK_DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      ROOK_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
