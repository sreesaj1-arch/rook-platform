{{- range $component, $port := dict "api" 8000 "frontend" 8080 "postgres" 5432 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    {{- include "rook.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  {{- if eq $component "postgres" }}
  clusterIP: None
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ if and (eq $component "api") (eq $.Values.apiTraffic "canary") }}api-canary{{ else }}{{ $component }}{{ end }}
  ports:
    - name: {{ if eq $component "postgres" }}postgres{{ else }}http{{ end }}
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
